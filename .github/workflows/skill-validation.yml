name: Skill static validation
on:
  pull_request:
    paths:
      - "plugins/noslop/skills/noslop/**"
      - "scripts/**"
      - "tests/**"
      - "evals/**"
      - "docs/phase-3-decision-register.md"
      - ".github/workflows/skill-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile all offline Python tools and tests
        run: python3 -m compileall -q scripts tests
      - name: Validate skill links, decisions, routing files and evaluation cases
        run: python3 scripts/validate_skill.py
      - name: Run offline unit tests, including Claude.ai ZIP structure tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and inspect Claude.ai Custom Skill ZIP
        run: |
          python3 scripts/build_claude_ai_skill.py --output dist/noslop-claude-ai.zip
          unzip -l dist/noslop-claude-ai.zip
      - name: Store reviewable ZIP as CI artifact (not release/deployment)
        uses: actions/upload-artifact@v4
        with:
          name: noslop-claude-ai-review
          path: dist/noslop-claude-ai.zip
          if-no-files-found: error
          retention-days: 14
# No marketplace release, live deployment or external publish steps.
